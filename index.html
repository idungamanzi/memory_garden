<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Garden — For You</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Dancing+Script:wght@400;600&family=Crimson+Text:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --rose: #c9627a;
      --deep-rose: #8b3a52;
      --gold: #d4a847;
      --cream: #fdf6e3;
      --sage: #4a7c6f;
      --deep-sage: #2d4f45;
      --petal-1: #f7c5d0;
      --petal-2: #f9d8c5;
      --petal-3: #f5e6c8;
      --night: #0d1117;
      --night-mid: #1a2332;
    }

    html, body {
      width: 100%; height: 100%;
      overflow-x: hidden;
    }

    body {
      background: var(--night);
      font-family: 'Crimson Text', serif;
      cursor: none;
    }

    /* ─── Custom Cursor ─── */
    .cursor {
      position: fixed;
      width: 12px; height: 12px;
      background: var(--rose);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: transform 0.1s ease, background 0.3s ease;
      mix-blend-mode: screen;
    }
    .cursor-ring {
      position: fixed;
      width: 36px; height: 36px;
      border: 1px solid rgba(201,98,122,0.5);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
      transition: transform 0.18s ease, width 0.3s ease, height 0.3s ease, border-color 0.3s ease;
    }

    /* ─── Canvas Stars ─── */
    #starCanvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* ─── Petals ─── */
    .petal {
      position: fixed;
      width: 14px; height: 18px;
      border-radius: 50% 10% 50% 10%;
      opacity: 0;
      pointer-events: none;
      z-index: 1;
      animation: petalFall linear infinite;
      filter: blur(0.3px);
    }
    @keyframes petalFall {
      0%   { transform: translateY(-30px) rotate(0deg) translateX(0); opacity: 0; }
      5%   { opacity: 0.8; }
      90%  { opacity: 0.6; }
      100% { transform: translateY(110vh) rotate(720deg) translateX(80px); opacity: 0; }
    }

    /* ─── Intro / Landing ─── */
    #intro {
      position: fixed;
      inset: 0;
      z-index: 500;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, #1a0e14 0%, #0d1117 70%);
      transition: opacity 1.5s ease, visibility 1.5s ease;
    }
    #intro.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    .intro-poem {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(1rem, 3vw, 1.5rem);
      color: rgba(253,246,227,0.6);
      text-align: center;
      max-width: 500px;
      line-height: 2;
      letter-spacing: 0.05em;
      animation: fadeUp 2s ease forwards;
      opacity: 0;
      margin-bottom: 50px;
    }
    .intro-title {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(2.5rem, 8vw, 5rem);
      color: var(--petal-1);
      text-align: center;
      animation: fadeUp 2s 0.6s ease forwards;
      opacity: 0;
      text-shadow: 0 0 60px rgba(201,98,122,0.5);
      margin-bottom: 60px;
    }
    .enter-btn {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--cream);
      background: transparent;
      border: 1px solid rgba(201,98,122,0.5);
      padding: 14px 40px;
      cursor: none;
      position: relative;
      overflow: hidden;
      transition: color 0.4s ease, border-color 0.4s ease;
      animation: fadeUp 2s 1.2s ease forwards;
      opacity: 0;
    }
    .enter-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--rose), var(--deep-rose));
      transform: translateX(-101%);
      transition: transform 0.4s cubic-bezier(0.77,0,0.18,1);
    }
    .enter-btn:hover::before { transform: translateX(0); }
    .enter-btn:hover { border-color: var(--rose); }
    .enter-btn span { position: relative; z-index: 1; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ─── Main Garden ─── */
    #garden-scene {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px 120px;
      opacity: 0;
      transition: opacity 1.5s ease;
    }
    #garden-scene.visible { opacity: 1; }

    .garden-title {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(2rem, 6vw, 4rem);
      color: var(--petal-1);
      text-align: center;
      text-shadow: 0 0 40px rgba(201,98,122,0.4);
      margin-bottom: 12px;
      letter-spacing: 0.02em;
    }
    .garden-subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(0.9rem, 2vw, 1.2rem);
      color: rgba(253,246,227,0.5);
      text-align: center;
      margin-bottom: 80px;
      letter-spacing: 0.12em;
    }

    /* ─── Flower Grid ─── */
    .garden {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 60px 80px;
      max-width: 700px;
      width: 100%;
      justify-items: center;
    }

    .flower-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      cursor: none;
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .flower-wrap.bloomed { opacity: 1; transform: translateY(0); }

    .flower-orbit {
      position: relative;
      width: 140px; height: 140px;
    }
    .flower-orbit::before {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 1px solid rgba(201,98,122,0);
      transition: border-color 0.5s ease, box-shadow 0.5s ease;
    }
    .flower-wrap:hover .flower-orbit::before {
      border-color: rgba(201,98,122,0.4);
      box-shadow: 0 0 30px rgba(201,98,122,0.2), inset 0 0 30px rgba(201,98,122,0.05);
    }

    .flower {
      width: 140px; height: 140px;
      background-size: cover;
      background-position: center;
      border-radius: 50%;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5), 0 0 0 3px rgba(201,98,122,0.15);
      transition: transform 0.5s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.5s ease;
      position: relative;
      overflow: hidden;
    }
    .flower::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.15), transparent 60%);
      pointer-events: none;
    }
    .flower-wrap:hover .flower {
      transform: scale(1.08) rotate(3deg);
      box-shadow: 0 16px 60px rgba(201,98,122,0.4), 0 0 0 3px rgba(201,98,122,0.4);
    }

    .flower-stem {
      width: 2px;
      height: 30px;
      background: linear-gradient(to bottom, var(--sage), transparent);
      border-radius: 2px;
    }
    .flower-label {
      font-family: 'Dancing Script', cursive;
      font-size: 1.1rem;
      color: rgba(253,246,227,0.7);
      letter-spacing: 0.05em;
      transition: color 0.3s ease;
    }
    .flower-wrap:hover .flower-label { color: var(--petal-1); }

    /* ─── Modal / Gallery ─── */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0);
      z-index: 800;
      backdrop-filter: blur(0px);
      transition: background 0.5s ease, backdrop-filter 0.5s ease;
    }
    .overlay.active {
      display: block;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(12px);
    }

    .modal {
      display: none;
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -48%) scale(0.92);
      width: min(90vw, 780px);
      max-height: 90vh;
      background: linear-gradient(145deg, #1a1020, #0f1a18);
      border: 1px solid rgba(201,98,122,0.2);
      border-radius: 2px;
      z-index: 900;
      overflow: hidden;
      box-shadow: 0 40px 120px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.03);
      opacity: 0;
      transition: transform 0.5s cubic-bezier(0.34,1.56,0.64,1), opacity 0.4s ease;
    }
    .modal.active {
      display: flex;
      flex-direction: column;
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    /* Decorative corner lines */
    .modal::before, .modal::after {
      content: '';
      position: absolute;
      width: 40px; height: 40px;
      border-color: rgba(212,168,71,0.4);
      border-style: solid;
      pointer-events: none;
      z-index: 1;
    }
    .modal::before { top: 12px; left: 12px; border-width: 1px 0 0 1px; }
    .modal::after  { bottom: 12px; right: 12px; border-width: 0 1px 1px 0; }

    .modal-image-wrap {
      position: relative;
      width: 100%;
      height: 55vh;
      background: #000;
      overflow: hidden;
      flex-shrink: 0;
    }
    .modal-img {
      width: 100%; height: 100%;
      object-fit: contain;
      display: block;
      transition: opacity 0.5s ease, transform 0.6s cubic-bezier(0.16,1,0.3,1);
    }
    .modal-img.transitioning {
      opacity: 0;
      transform: scale(1.04);
    }

    /* image counter pill */
    .img-counter {
      position: absolute;
      bottom: 14px; right: 14px;
      background: rgba(0,0,0,0.6);
      color: rgba(255,255,255,0.6);
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      padding: 4px 12px;
      border-radius: 20px;
      pointer-events: none;
    }

    .modal-body {
      padding: 28px 36px 36px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .modal-season {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.75rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0.8;
    }
    .modal-message {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(1.1rem, 2.5vw, 1.5rem);
      color: var(--petal-1);
      line-height: 1.7;
    }
    .modal-controls {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 4px;
    }
    .ctrl-btn {
      background: transparent;
      border: 1px solid rgba(201,98,122,0.3);
      color: rgba(253,246,227,0.7);
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      padding: 8px 22px;
      cursor: none;
      transition: all 0.3s ease;
      border-radius: 1px;
    }
    .ctrl-btn:hover {
      background: rgba(201,98,122,0.12);
      border-color: rgba(201,98,122,0.6);
      color: var(--petal-1);
    }
    .close-btn {
      margin-left: auto;
      background: transparent;
      border: none;
      color: rgba(253,246,227,0.35);
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: none;
      transition: color 0.3s ease;
      padding: 8px 0;
    }
    .close-btn:hover { color: rgba(253,246,227,0.8); }

    /* ─── Heartbeat pulse on close btn ─── */
    .heart-icon {
      position: absolute;
      font-size: 1.2rem;
      pointer-events: none;
      animation: heartFloat 1.2s ease forwards;
      z-index: 9999;
    }
    @keyframes heartFloat {
      0%   { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-60px) scale(1.6); }
    }

    /* ─── Bottom quote ─── */
    .garden-quote {
      margin-top: 100px;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(0.85rem, 1.8vw, 1.1rem);
      color: rgba(253,246,227,0.3);
      text-align: center;
      max-width: 400px;
      line-height: 2;
      letter-spacing: 0.06em;
    }

    /* ─── Responsive ─── */
    @media (max-width: 520px) {
      .garden { grid-template-columns: 1fr 1fr; gap: 40px 40px; }
      .flower, .flower-orbit { width: 110px; height: 110px; }
      .modal-body { padding: 20px 22px 28px; }
    }
    @media (max-width: 380px) {
      .garden { gap: 30px 20px; }
      .flower, .flower-orbit { width: 90px; height: 90px; }
    }
  </style>
</head>
<body>

<canvas id="starCanvas"></canvas>
<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>

<!-- Petals container (filled by JS) -->
<div id="petals"></div>

<!-- ───── INTRO ───── -->
<div id="intro">
  <p class="intro-poem">
    "In every petal of memory,<br>
    I find your laughter,<br>
    your warmth,<br>
    you."
  </p>
  <h1 class="intro-title">A Garden For You</h1>
  <button class="enter-btn" onclick="enterGarden()"><span>Enter the Garden</span></button>
</div>

<!-- ───── GARDEN ───── -->
<div id="garden-scene">
  <h2 class="garden-title">Our Memory Garden</h2>
  <p class="garden-subtitle">touch a flower to remember</p>

  <div class="garden">

    <div class="flower-wrap" onclick="showGallery('winter')" id="fw-winter">
      <div class="flower-orbit">
        <div class="flower" style="background-image: url('images/WhatsApp Image 2025-06-05 at 21.24.43.jpeg');"></div>
      </div>
      <div class="flower-stem"></div>
      <div class="flower-label">Winter</div>
    </div>

    <div class="flower-wrap" onclick="showGallery('autumn')" id="fw-autumn">
      <div class="flower-orbit">
        <div class="flower" style="background-image: url('images/WhatsApp Image 2025-06-05 at 21.25.05.jpeg');"></div>
      </div>
      <div class="flower-stem"></div>
      <div class="flower-label">Autumn</div>
    </div>

    <div class="flower-wrap" onclick="showGallery('spring')" id="fw-spring">
      <div class="flower-orbit">
        <div class="flower" style="background-image: url('images/WhatsApp Image 2025-06-05 at 21.25.15.jpeg');"></div>
      </div>
      <div class="flower-stem"></div>
      <div class="flower-label">Spring</div>
    </div>

    <div class="flower-wrap" onclick="showGallery('funny')" id="fw-funny">
      <div class="flower-orbit">
        <div class="flower" style="background-image: url('images/WhatsApp Image 2025-06-05 at 21.27.38.jpeg');"></div>
      </div>
      <div class="flower-stem"></div>
      <div class="flower-label">Joy</div>
    </div>

  </div>

  <p class="garden-quote">
    "Some moments are too beautiful<br>
    to live only once."
  </p>
</div>

<!-- ───── OVERLAY ───── -->
<div class="overlay" id="overlay" onclick="hideModal()"></div>

<!-- ───── MODAL ───── -->
<div class="modal" id="modal">
  <div class="modal-image-wrap">
    <img class="modal-img" id="modalImg" src="" alt="">
    <div class="img-counter" id="imgCounter">1 / 1</div>
  </div>
  <div class="modal-body">
    <div class="modal-season" id="modalSeason"></div>
    <div class="modal-message" id="modalMsg"></div>
    <div class="modal-controls">
      <button class="ctrl-btn" onclick="prevImage()">← Prev</button>
      <button class="ctrl-btn" onclick="nextImage()">Next →</button>
      <button class="close-btn" onclick="hideModal()">close ×</button>
    </div>
  </div>
</div>

<audio id="bgMusic" loop></audio>

<script>
/* ─── Data ─── */
const galleries = {
  winter: {
    label: 'Winter',
    images: [
      'images/20210731_161128.jpg',
      'images/20210731_161039.jpg',
      'images/IMG-20210802-WA0021.jpg',
      'images/IMG-20210810-WA0051.jpg',
      'images/IMG-20210827-WA0021.jpg',
    ],
    music: 'audio/WhatsApp Audio 2025-05-30 at 22.39.48.mpeg',
    message: "Winter brought stillness and reflection — and somehow, in all that quiet, you were the warmest thing."
  },
  autumn: {
    label: 'Autumn',
    images: [
      'images/IMG-20210404-WA0008.jpg',
      'images/IMG-20210404-WA0015.jpg',
      'images/IMG-20210416-WA0061.jpg',
      'images/IMG-20210416-WA0063.jpg'
    ],
    music: 'audio/WhatsApp Audio 2025-05-30 at 22.40.52.mpeg',
    message: "Golden leaves and golden memories. Every colour you wore that season made the world look richer."
  },
  spring: {
    label: 'Spring',
    images: [
      'images/IMG-20211016-WA0037.jpg',
      'images/IMG-20211113-WA0010.jpg',
      'images/IMG-20211113-WA0011.jpg',
      'images/IMG-20211113-WA0012.jpg'
    ],
    music: 'audio/WhatsApp Audio 2025-05-30 at 22.39.51.mpeg',
    message: "New beginnings and blooming laughter. You are the spring I never knew I was waiting for."
  },
  funny: {
    label: 'Joy',
    images: ['images/IMG-20211107-WA0038.jpg'],
    music: 'audio/WhatsApp Audio 2025-05-30 at 22.40.36.mpeg',
    message: "Ngiyahleka njalo mangibuka lesithombe — one laugh from you and the whole world softens."
  }
};

let currentGallery = [];
let currentIndex = 0;
let currentKey = '';

/* ─── Cursor ─── */
const cur = document.getElementById('cursor');
const ring = document.getElementById('cursorRing');
let mx = 0, my = 0, rx = 0, ry = 0;

document.addEventListener('mousemove', e => {
  mx = e.clientX; my = e.clientY;
  cur.style.left = mx + 'px';
  cur.style.top  = my + 'px';
});

(function animRing() {
  rx += (mx - rx) * 0.12;
  ry += (my - ry) *.12;
  ring.style.left = rx + 'px';
  ring.style.top  = ry + 'px';
  requestAnimationFrame(animRing);
})();

document.querySelectorAll('button, .flower-wrap').forEach(el => {
  el.addEventListener('mouseenter', () => {
    cur.style.transform = 'translate(-50%,-50%) scale(1.8)';
    cur.style.background = 'var(--gold)';
    ring.style.width = '54px'; ring.style.height = '54px';
    ring.style.borderColor = 'rgba(212,168,71,0.5)';
  });
  el.addEventListener('mouseleave', () => {
    cur.style.transform = 'translate(-50%,-50%) scale(1)';
    cur.style.background = 'var(--rose)';
    ring.style.width = '36px'; ring.style.height = '36px';
    ring.style.borderColor = 'rgba(201,98,122,0.5)';
  });
});

/* ─── Stars ─── */
const canvas = document.getElementById('starCanvas');
const ctx = canvas.getContext('2d');
let stars = [];

function resizeCanvas() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  initStars();
}

function initStars() {
  stars = [];
  const count = Math.floor((canvas.width * canvas.height) / 4000);
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.2 + 0.2,
      alpha: Math.random(),
      speed: Math.random() * 0.004 + 0.001,
      offset: Math.random() * Math.PI * 2
    });
  }
}

function drawStars() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const t = Date.now() * 0.001;
  stars.forEach(s => {
    const a = 0.2 + 0.6 * (0.5 + 0.5 * Math.sin(t * s.speed * 10 + s.offset));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(253,246,227,${a})`;
    ctx.fill();
  });
  requestAnimationFrame(drawStars);
}

window.addEventListener('resize', resizeCanvas);
resizeCanvas();
drawStars();

/* ─── Petals ─── */
const petalColors = ['#f7c5d0','#f9d8c5','#f5e6c8','#e8c5d0','#fde8f0'];
const petalContainer = document.getElementById('petals');

for (let i = 0; i < 18; i++) {
  const p = document.createElement('div');
  p.className = 'petal';
  const size = 8 + Math.random() * 12;
  p.style.cssText = `
    left: ${Math.random() * 100}vw;
    width: ${size}px;
    height: ${size * 1.3}px;
    background: ${petalColors[Math.floor(Math.random() * petalColors.length)]};
    animation-duration: ${8 + Math.random() * 14}s;
    animation-delay: ${Math.random() * 12}s;
    opacity: 0;
    border-radius: ${40 + Math.random() * 20}% ${10 + Math.random() * 20}% ${40 + Math.random() * 20}% ${10 + Math.random() * 20}%;
  `;
  petalContainer.appendChild(p);
}

/* ─── Intro → Garden ─── */
function enterGarden() {
  document.getElementById('intro').classList.add('hidden');
  const scene = document.getElementById('garden-scene');
  scene.classList.add('visible');
  // Stagger flower blooms
  const flowers = document.querySelectorAll('.flower-wrap');
  flowers.forEach((f, i) => {
    setTimeout(() => f.classList.add('bloomed'), 400 + i * 180);
  });
}

/* ─── Modal ─── */
function showGallery(key) {
  const g = galleries[key];
  currentGallery = g.images;
  currentKey = key;
  currentIndex = 0;
  updateModalImage(false);
  document.getElementById('modalMsg').textContent    = g.message;
  document.getElementById('modalSeason').textContent = g.label;

  const music = document.getElementById('bgMusic');
  music.src = g.music;
  music.play().catch(() => {});

  const overlay = document.getElementById('overlay');
  overlay.style.display = 'block';
  requestAnimationFrame(() => overlay.classList.add('active'));

  const modal = document.getElementById('modal');
  modal.style.display = 'flex';
  requestAnimationFrame(() => modal.classList.add('active'));
}

function updateModalImage(animate = true) {
  const img = document.getElementById('modalImg');
  const counter = document.getElementById('imgCounter');
  counter.textContent = `${currentIndex + 1} / ${currentGallery.length}`;

  if (animate) {
    img.classList.add('transitioning');
    setTimeout(() => {
      img.src = currentGallery[currentIndex];
      img.onload = () => img.classList.remove('transitioning');
    }, 300);
  } else {
    img.src = currentGallery[currentIndex];
  }
}

function hideModal() {
  const modal   = document.getElementById('modal');
  const overlay = document.getElementById('overlay');
  modal.classList.remove('active');
  overlay.classList.remove('active');
  setTimeout(() => {
    modal.style.display   = 'none';
    overlay.style.display = 'none';
  }, 500);
  const music = document.getElementById('bgMusic');
  music.pause();
  music.currentTime = 0;
}

function nextImage() {
  if (currentIndex < currentGallery.length - 1) {
    currentIndex++;
    updateModalImage();
    spawnHeart();
  }
}

function prevImage() {
  if (currentIndex > 0) {
    currentIndex--;
    updateModalImage();
  }
}

/* ─── Floating heart on next ─── */
function spawnHeart() {
  const h = document.createElement('div');
  h.className = 'heart-icon';
  h.textContent = ['🌸','💗','✨','🌺','💕'][Math.floor(Math.random() * 5)];
  h.style.left = (mx - 12) + 'px';
  h.style.top  = (my - 12) + 'px';
  document.body.appendChild(h);
  setTimeout(() => h.remove(), 1200);
}

/* ─── Keyboard nav ─── */
document.addEventListener('keydown', e => {
  if (!document.getElementById('modal').classList.contains('active')) return;
  if (e.key === 'ArrowRight') nextImage();
  if (e.key === 'ArrowLeft')  prevImage();
  if (e.key === 'Escape')     hideModal();
});
</script>
</body>
</html>
